<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="鲸歌 banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".55" stop-color="#111c3a"/>
      <stop offset="1" stop-color="#1d2f6b"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="90" r="120" fill="#3b82f6" opacity=".18" filter="url(#soft)"/>
  <circle cx="250" cy="280" r="90" fill="#8b5cf6" opacity=".16" filter="url(#soft)"/>

  <!-- 星点 -->
  <g fill="#dbeafe" opacity=".55">
    <circle cx="120" cy="60" r="2"/><circle cx="210" cy="40" r="1.5"/>
    <circle cx="560" cy="55" r="2"/><circle cx="660" cy="30" r="1.4"/>
    <circle cx="1140" cy="120" r="1.8"/><circle cx="1090" cy="60" r="1.3"/>
    <circle cx="80" cy="230" r="1.6"/><circle cx="520" cy="300" r="1.5"/>
  </g>

  <!-- 左侧歌词气泡 -->
  <g>
    <path d="M96 84h328a26 26 0 0 1 26 26v112a26 26 0 0 1-26 26H236l-42 38v-38H96a26 26 0 0 1-26-26V110a26 26 0 0 1 26-26z" fill="#f8fafc"/>
    <path d="M96 84h328a26 26 0 0 1 26 26v112a26 26 0 0 1-26 26H236l-42 38v-38H96a26 26 0 0 1-26-26V110a26 26 0 0 1 26-26z" fill="none" stroke="#c7d2fe" stroke-width="2"/>
    <path d="M150 142v34.5a15 15 0 1 0 8-13.1V150l28-6v34.5a15 15 0 1 0 8-13.1V128l-44 10z" fill="url(#note)"/>
    <g fill="#334155" opacity=".85">
      <rect x="220" y="142" width="170" height="12" rx="6"/>
      <rect x="220" y="170" width="130" height="12" rx="6"/>
      <rect x="220" y="198" width="150" height="12" rx="6"/>
    </g>
    <circle cx="140" cy="246" r="5" fill="#818cf8"/>
    <circle cx="160" cy="246" r="5" fill="#a5b4fc" opacity=".7"/>
    <circle cx="180" cy="246" r="5" fill="#c7d2fe" opacity=".5"/>
  </g>

  <!-- 右侧鲸鱼 + 声波 -->
  <g>
    <g fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity=".55">
      <path d="M1085 190c26-18 42-42 42-74"/>
      <path d="M1108 198c34-24 54-56 54-98"/>
      <path d="M1130 206c42-30 66-70 66-122"/>
    </g>
    <path d="M760 232c46-78 168-102 246-64 34 16 58 42 72 68-44 22-98 34-152 32-58-2-116-16-166-36z" fill="url(#whale)"/>
    <path d="M1078 236c30-28 62-42 88-38-18 26-28 54-26 80-28-8-48-24-62-42z" fill="url(#whale)"/>
    <path d="M900 236c14 30 34 48 58 58-10-28-12-50-10-68z" fill="#4f46e5" opacity=".9"/>
    <path d="M770 238c-22 12-38 30-46 52 30-8 54-8 74-2-12-18-20-34-28-50z" fill="#4f46e5" opacity=".55"/>
    <circle cx="984" cy="200" r="7" fill="#0b1220"/>
    <circle cx="986" cy="198" r="2.4" fill="#e0f2fe"/>
    <path d="M1020 230c12 2 22 0 30-6" fill="none" stroke="#0b1220" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <g fill="#bfdbfe" opacity=".8">
      <circle cx="800" cy="120" r="4"/><circle cx="826" cy="98" r="2.6"/><circle cx="852" cy="82" r="2"/>
    </g>
  </g>

  <!-- 底部文字 -->
  <g font-family="'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="70" y="312" fill="#93c5fd" font-size="20" letter-spacing="1.2">dsh-pet × QQ Music / NetEase Cloud Music</text>
    <text x="1130" y="312" fill="#64748b" font-size="16" text-anchor="end">Windows · SMTC + elog · MIT</text>
  </g>
</svg>
