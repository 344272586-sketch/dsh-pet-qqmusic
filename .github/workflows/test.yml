name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run unit tests
        run: node --test test/*.test.mjs

  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        shell: pwsh
        run: |
          $files = Get-ChildItem test -Filter *.test.mjs | ForEach-Object { $_.FullName }
          & node --test @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile SMTC helper
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc not found: $csc" }
          $fw = Split-Path $csc
          $out = Join-Path $env:RUNNER_TEMP 'smtc-helper.exe'
          & $csc /nologo /target:exe "/out:$out" `
            "/r:$fw\System.Runtime.dll" `
            "/r:$fw\System.Runtime.WindowsRuntime.dll" `
            "/r:$env:WINDIR\System32\WinMetadata\Windows.Foundation.winmd" `
            "/r:$env:WINDIR\System32\WinMetadata\Windows.Media.winmd" `
            "/r:$env:WINDIR\System32\WinMetadata\Windows.Storage.winmd" `
            (Join-Path $PWD 'lib\smtc-helper.cs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $raw = & $out --any
          if (-not $raw) { throw 'smtc-helper returned no output' }
          $json = $raw | ConvertFrom-Json
          if ($null -eq $json.ok) { throw 'invalid helper JSON' }
          Write-Host ("helper ok=" + $json.ok + " count=" + $json.count)
